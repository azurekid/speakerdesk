# Provision (Bicep), build, migrate and deploy SpeakerDesk to Azure Container Apps.
# Setup (one time): see docs/deploy-azure.md → "Continuous deployment".

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure — no stored Azure credentials
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: speakerdesk

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow az CLI extensions (containerapp) to install without prompting
        run: az config set extension.use_dynamic_install=yes_without_prompt

      # Inputs for infra/main.bicepparam. Exported after `npm ci` so install scripts never see the secrets.
      - name: Prepare Bicep parameters
        run: |
          for v in SPEAKERDESK_PG_PASSWORD SPEAKERDESK_AUTH_SECRET SPEAKERDESK_ADMIN_EMAILS SPEAKERDESK_PUBLIC_URL SPEAKERDESK_CUSTOM_DOMAINS SPEAKERDESK_EMAIL_DOMAIN \
                   SPEAKERDESK_GITHUB_CLIENT_ID SPEAKERDESK_GITHUB_CLIENT_SECRET SPEAKERDESK_GOOGLE_CLIENT_ID SPEAKERDESK_GOOGLE_CLIENT_SECRET \
                   SPEAKERDESK_LINKEDIN_CLIENT_ID SPEAKERDESK_LINKEDIN_CLIENT_SECRET SPEAKERDESK_MICROSOFT_CLIENT_ID SPEAKERDESK_MICROSOFT_CLIENT_SECRET \
                   SPEAKERDESK_APPLE_WALLET_PASS_TYPE_ID SPEAKERDESK_APPLE_WALLET_TEAM_ID SPEAKERDESK_APPLE_WALLET_CERT SPEAKERDESK_APPLE_WALLET_KEY \
                   SPEAKERDESK_APPLE_WALLET_KEY_PASSPHRASE SPEAKERDESK_APPLE_WALLET_WWDR_CERT \
                   SPEAKERDESK_GOOGLE_WALLET_ISSUER_ID SPEAKERDESK_GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL SPEAKERDESK_GOOGLE_WALLET_PRIVATE_KEY; do
            # Delimiter form, so multi-line values (PEM certificates and keys) survive.
            { echo "$v<<__SPEAKERDESK_EOF__"; echo "${!v}"; echo "__SPEAKERDESK_EOF__"; } >> "$GITHUB_ENV"
          done
        env:
          SPEAKERDESK_PG_PASSWORD: ${{ secrets.SPEAKERDESK_PG_PASSWORD }}
          SPEAKERDESK_AUTH_SECRET: ${{ secrets.SPEAKERDESK_AUTH_SECRET }}
          SPEAKERDESK_ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          SPEAKERDESK_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          SPEAKERDESK_CUSTOM_DOMAINS: ${{ vars.CUSTOM_DOMAINS || '[]' }}
          SPEAKERDESK_EMAIL_DOMAIN: ${{ vars.EMAIL_DOMAIN }}
          SPEAKERDESK_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          SPEAKERDESK_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          SPEAKERDESK_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          SPEAKERDESK_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          SPEAKERDESK_LINKEDIN_CLIENT_ID: ${{ secrets.OAUTH_LINKEDIN_CLIENT_ID }}
          SPEAKERDESK_LINKEDIN_CLIENT_SECRET: ${{ secrets.OAUTH_LINKEDIN_CLIENT_SECRET }}
          SPEAKERDESK_MICROSOFT_CLIENT_ID: ${{ secrets.OAUTH_MICROSOFT_CLIENT_ID }}
          SPEAKERDESK_MICROSOFT_CLIENT_SECRET: ${{ secrets.OAUTH_MICROSOFT_CLIENT_SECRET }}
          SPEAKERDESK_APPLE_WALLET_PASS_TYPE_ID: ${{ vars.APPLE_WALLET_PASS_TYPE_ID }}
          SPEAKERDESK_APPLE_WALLET_TEAM_ID: ${{ vars.APPLE_WALLET_TEAM_ID }}
          SPEAKERDESK_APPLE_WALLET_CERT: ${{ secrets.APPLE_WALLET_CERT }}
          SPEAKERDESK_APPLE_WALLET_KEY: ${{ secrets.APPLE_WALLET_KEY }}
          SPEAKERDESK_APPLE_WALLET_KEY_PASSPHRASE: ${{ secrets.APPLE_WALLET_KEY_PASSPHRASE }}
          SPEAKERDESK_APPLE_WALLET_WWDR_CERT: ${{ secrets.APPLE_WALLET_WWDR_CERT }}
          SPEAKERDESK_GOOGLE_WALLET_ISSUER_ID: ${{ vars.GOOGLE_WALLET_ISSUER_ID }}
          SPEAKERDESK_GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL: ${{ vars.GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL }}
          SPEAKERDESK_GOOGLE_WALLET_PRIVATE_KEY: ${{ secrets.GOOGLE_WALLET_PRIVATE_KEY }}

      - name: Create resource group
        run: |
          az group create \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --output none

      # Phase 1 — everything except the container app (it needs an image and a schema first).
      # Incremental mode leaves an already-running app untouched.
      - name: Deploy infrastructure (Bicep)
        id: infra
        env:
          SPEAKERDESK_DEPLOY_APP: "false"
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --name "infra-${{ github.run_number }}" \
            --output none
          out() { az deployment group show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "infra-${{ github.run_number }}" --query "properties.outputs.$1.value" -o tsv; }
          {
            echo "acr_name=$(out registryName)"
            echo "acr_server=$(out registryLoginServer)"
            echo "pg_server=$(out postgresServerName)"
            echo "pg_host=$(out postgresHost)"
          } >> "$GITHUB_OUTPUT"

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ steps.infra.outputs.acr_name }}" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --image "$IMAGE_NAME:latest" \
            .

      # `az rest` instead of `az postgres flexible-server firewall-rule`: that command's arguments changed between CLI versions.
      - name: Open database firewall for this runner
        id: firewall
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          RULE="gha-${{ github.run_id }}"
          URL="https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ steps.infra.outputs.pg_server }}/firewallRules/$RULE?api-version=2024-08-01"
          az rest --method put --url "$URL" \
            --body "{\"properties\":{\"startIpAddress\":\"$IP\",\"endIpAddress\":\"$IP\"}}" --output none
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
          sleep 30 # the rule is applied asynchronously

      - name: Run database migrations
        run: |
          ENCODED=$(node -p 'encodeURIComponent(process.env.SPEAKERDESK_PG_PASSWORD)')
          echo "::add-mask::$ENCODED"
          export DATABASE_URL="postgresql://speakerdesk:${ENCODED}@${{ steps.infra.outputs.pg_host }}:5432/speakerdesk?sslmode=require"
          npm run db:deploy
        env:
          SPEAKERDESK_PG_PASSWORD: ${{ secrets.SPEAKERDESK_PG_PASSWORD }}

      - name: Close database firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az rest --method delete --output none \
            --url "https://management.azure.com/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DBforPostgreSQL/flexibleServers/${{ steps.infra.outputs.pg_server }}/firewallRules/${{ steps.firewall.outputs.rule }}?api-version=2024-08-01"

      # Phase 2 — deploy the container app with the new image.
      - name: Deploy app (Bicep)
        env:
          SPEAKERDESK_DEPLOY_APP: "true"
          SPEAKERDESK_IMAGE: ${{ steps.infra.outputs.acr_server }}/speakerdesk:${{ github.sha }}
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --name "app-${{ github.run_number }}" \
            --output none

      - name: Smoke test
        run: |
          URL=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "speakerdesk" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$URL/api/health?deep=1"; then echo; echo "Healthy: https://$URL"; exit 0; fi
            sleep 10
          done
          echo "App did not become healthy" >&2
          exit 1
