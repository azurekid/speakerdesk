# Build, migrate and deploy SpeakerDesk to Azure Container Apps.
# Setup (one time): see docs/deploy-azure.md → "Continuous deployment".

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # OIDC login to Azure — no stored Azure credentials
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: speakerdesk

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow az CLI extensions (containerapp) to install without prompting
        run: az config set extension.use_dynamic_install=yes_without_prompt

      - name: Build image in Azure Container Registry
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            --image "$IMAGE_NAME:latest" \
            .

      - name: Open database firewall for this runner
        id: firewall
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          RULE="gha-${{ github.run_id }}"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.POSTGRES_SERVER_NAME }}" \
            --rule-name "$RULE" --start-ip-address "$IP" --end-ip-address "$IP" --output none
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close database firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.POSTGRES_SERVER_NAME }}" \
            --rule-name "${{ steps.firewall.outputs.rule }}" --yes --output none

      - name: Roll out the new image
        run: |
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.CONTAINER_APP_NAME }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
            --output none

      - name: Smoke test
        run: |
          URL=$(az containerapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.CONTAINER_APP_NAME }}" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 30); do
            if curl -fsS "https://$URL/api/health?deep=1"; then echo; echo "Healthy: https://$URL"; exit 0; fi
            sleep 10
          done
          echo "App did not become healthy" >&2
          exit 1
